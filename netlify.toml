[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_SUPABASE_URL = "https://vqtzmhfnyaujkbczibwu.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mnferSlOXnSwAxFkK-nMYg_3MPzYhYm"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files have content hashes in their names, so browsers can keep them for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
