<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202124" />
    <meta
      name="description"
      content="Notis is a writing app with a progress board. Write updates as you work, turn them into posts, and show them on a portfolio next to your resume."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Opens the Supabase connection early, since all data comes from there. -->
    <link rel="preconnect" href="https://vqtzmhfnyaujkbczibwu.supabase.co" crossorigin />
    <!-- Starts the two main fonts with the page instead of after the CSS, so text paints in them from the start. -->
    <link
      rel="preload"
      href="/fonts/dm-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/literata-latin-opsz-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Notis — Notes that show your progress</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
